# Render Blueprint – ARTCRAFTS Backend API
# Frontend is deployed separately on Vercel
services:
  - type: web
    name: artcrafts-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DB_PATH
        value: /opt/render/project/data/artcrafts.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: ARTCRAFTS Administrator
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: artcrafts-media
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
    disk:
      name: artcrafts-data
      mountPath: /opt/render/project/data
      sizeGB: 1
